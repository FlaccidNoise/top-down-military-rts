<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1d1a" />
    <!-- The pair that makes viewport-fit=cover plus the env(safe-area-inset-*)
         padding in ui.css actually pay off on a notched iPhone. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Normandy" />
    <!-- RELATIVE, matching the 2026-07-24 `base: './'` deploy decision: an
         absolute /manifest.webmanifest 404s on every subpath host. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-512.png" />
    <title>Close Combat-like</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        background: #1a1d1a;
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
      }
      /* touch-action stays scoped to the canvas: a global rule would kill
         scrolling in the roster, chit panel, pause menu and debrief. */
      canvas {
        display: block;
        position: fixed;
        inset: 0;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
    </style>
  </head>
  <body>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
